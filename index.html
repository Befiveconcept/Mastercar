<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F1F21">
<script>/* Hell/Dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen) */
(function () { var t = null; try { t = localStorage.getItem('mc-theme'); } catch (e) { }
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#F3F3EF' : '#1F1F21'); })();</script>
<meta name="robots" content="noindex,nofollow">
<title>Mastercar Finanzen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F1F21'/%3E%3Cpath d='M6 23V9h4l6 8 6-8h4v14h-4v-8l-6 8-6-8v8z' fill='%23FFFE0F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F1F21; --bg2:#18181A; --surface:#2B2B2E; --surface2:#333337; --line:rgba(255,255,255,.12); --ink:#fff; --ink2:rgba(255,255,255,.75); --muted:rgba(255,255,255,.55);
  --y:#FFFE0F; --y-t:#FFFE0F; --y-soft:rgba(255,254,15,.12); --top-bg:rgba(31,31,33,.92); --dot:rgba(255,255,255,.04); --glass:rgba(255,255,255,.05); --glass-b:rgba(255,255,255,.12); --bad-t:var(--bad-t); --ok:#3ecf8e; --warn:#f5a524; --bad:#f0505a; --info:#7aa7d6;
  --f-h:'Oswald',Impact,sans-serif; --f-b:'Figtree',system-ui,sans-serif; --f-m:ui-monospace,Consolas,monospace;
  --r:10px;
}
/* Hell-Modus (Schieberegler oben; ohne Wahl folgt die App der Einstellung des Geräts) */
:root[data-theme="light"]{
  --bg:#F3F3EF; --bg2:#E9E9E4; --surface:#FFFFFF; --surface2:#F1F1EC; --line:rgba(0,0,0,.12); --ink:#1F1F21; --ink2:rgba(0,0,0,.72); --muted:rgba(0,0,0,.52);
  --y-t:#6B6300; --y-soft:rgba(230,215,0,.18); --ok:#178a5a; --warn:#b26b00; --bad:#d23a44; --bad-t:#c42f3a; --info:#2f6aa8;
  --top-bg:rgba(243,243,239,.92); --dot:rgba(0,0,0,.035); --glass:rgba(0,0,0,.03); --glass-b:rgba(0,0,0,.1);
  color-scheme:light;
}
:root{color-scheme:dark}
:root[data-theme="light"] .hero,:root[data-theme="light"] .kpi{background:linear-gradient(135deg,#FFFFFF 0%,#F7F7F2 55%,#FFFBC8 100%)}
:root[data-theme="light"] .dropveil{background:rgba(243,243,239,.9)}
:root[data-theme="light"] .wheel{border-color:rgba(0,0,0,.12);border-top-color:var(--y)}
:root[data-theme="light"] .nav.on,:root[data-theme="light"] .chip.on,:root[data-theme="light"] .btn.primary{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
:root[data-theme="light"] .brand .logo{color:#1F1F21;background:var(--y);padding:2px 6px;border-radius:4px;align-self:flex-start}
:root[data-theme="light"] .sheet-bg{background:rgba(0,0,0,.35)}
:root[data-theme="light"] .tw.scroll::-webkit-scrollbar-thumb{background:#d9cf00}
/* Schieberegler Hell/Dunkel */
.thm{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:14px}
.thm input{position:absolute;opacity:0;width:1px;height:1px}
.thm i{position:relative;width:44px;height:24px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);transition:background .2s}
.thm i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--y);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.thm input:checked+i::after{transform:translateX(20px)}
.thm input:focus-visible+i{outline:2px solid var(--y);outline-offset:2px}
.side-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px}
.menu-btn,.tabbar{display:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-weight:500;font-size:15px;line-height:1.45}
body{background:var(--bg) radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/6px 6px}
h1,h2,h3,h4{font-family:var(--f-h);font-weight:500;letter-spacing:.02em;margin:0}
h1{font-size:28px;text-transform:uppercase}h2{font-size:22px}h3{font-size:17px;text-transform:uppercase;margin-bottom:12px;color:var(--ink)}h4{font-size:15px;margin:18px 0 8px;text-transform:uppercase;color:var(--ink2)}
a{color:var(--y-t)}
button{font:inherit;color:inherit;cursor:pointer}
.small{font-size:12.5px}.muted{color:var(--muted)}.mono{font-family:var(--f-m);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.big{font-size:22px}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}

/* Layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;padding:0 8px}.brand .logo{font-family:var(--f-h);font-size:26px;letter-spacing:.04em;color:var(--y-t);line-height:1}.brand .sub{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.brand.big .logo{font-size:40px}
#nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
.nav:hover{background:var(--surface);color:var(--ink)}.nav.on{background:var(--y);color:#1F1F21;font-weight:700}
.ni{width:20px;text-align:center;font-size:15px}.nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;color:var(--muted);padding:0 8px}.side-foot .on{color:var(--ok)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px}
main{padding:22px 24px 80px;max-width:1400px;width:100%;outline:none}

/* Begrüßung (wie im Sonnenplan) */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;padding:22px 24px;margin-bottom:16px;background:linear-gradient(135deg,#141416 0%,#232326 60%,#2a2a05 100%);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,254,15,.3) 0%,rgba(255,254,15,.06) 45%,transparent 70%)}
.hero-ey{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.hero h1{font-size:34px;text-transform:none;margin:4px 0 12px}.hero h1 span{color:var(--y-t)}
.hero-items{display:flex;flex-wrap:wrap;gap:8px}
.hi-i{border:1px solid var(--glass-b);background:var(--glass);color:var(--ink);border-radius:99px;padding:7px 13px;font-size:13.5px}
button.hi-i:hover{border-color:var(--y)}.hi-i b{color:var(--y-t)}.hi-i.warn{border-color:rgba(240,80,90,.55)}.hi-i.warn b{color:var(--bad-t)}
.hero-td{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-width:760px}
.toolbar.sec{margin-top:6px}.toolbar.sec h2{font-size:20px;text-transform:uppercase}
/* Suchleiste: unter der Überschrift, mit Drag & Drop */
.omni-wrap{position:relative;margin:0 0 18px;border:1.5px dashed transparent;border-radius:16px}
.omni-wrap.over{border-color:var(--y);background:var(--y-soft)}
.omni-wrap.over .omni{border-style:dashed;border-color:var(--y)}
.omni-hint{color:var(--muted);padding:6px 4px 0}
.omni{position:relative;display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px}
.omni:focus-within{border-color:var(--y);box-shadow:0 0 0 3px var(--y-soft)}
.omni-ic{color:var(--muted);font-size:18px}
.omni input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:8px 4px;outline:none}
.omni input::placeholder{color:var(--muted)}
.omni-b{border:0;background:none;width:36px;height:36px;border-radius:9px;font-size:16px}.omni-b:hover{background:var(--surface2)}.omni-b.rec{background:var(--bad)}
.omni-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:70vh;overflow:auto;z-index:50}
.omni-res:empty{display:none}
.o-g{padding:6px}.o-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px}.o-h span{color:var(--y-t)}
.o-r{display:flex;flex-direction:column;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}.o-r:hover,.o-r:focus{background:var(--surface2)}
.o-r span{font-size:12.5px;color:var(--muted)}.o-none,.o-more{padding:12px 14px;color:var(--muted);font-size:13px}

/* Elemente */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink2)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--y);color:#1F1F21;border-color:var(--y);font-weight:700}.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad);border-color:rgba(240,80,90,.4)}.btn.sm{padding:6px 10px;font-size:13px}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;color:var(--ink2)}.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.lnk{border:0;background:none;color:var(--y-t);padding:6px 0;text-decoration:underline}
.inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
.inp:focus{border-color:var(--y);outline:none}select.inp{width:auto}
.fld{display:flex;flex-direction:column;gap:4px}.fld>span{font-size:12.5px;color:var(--ink2)}.fld select.inp{width:100%}.fld.full{grid-column:1/-1}.fld.inline{flex-direction:row;align-items:center;gap:10px;margin:10px 0}.fld.inline .inp{width:180px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.sp{flex:1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.filters .search{width:280px;flex:0 1 280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--ink2);padding:6px 12px;border-radius:99px;font-size:13px}.chip:hover{color:var(--ink);border-color:var(--ink2)}.chip.on{background:var(--y);border-color:var(--y);color:#1F1F21;font-weight:700}
.sumline{font-size:13px;color:var(--ink2);margin:6px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.cnt{font-family:var(--f-b);font-size:12px;background:var(--surface2);border-radius:99px;padding:2px 8px;margin-left:6px;color:var(--ink2);vertical-align:middle}
.empty{color:var(--muted);text-align:center;padding:22px}
.warn{background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.35);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}

/* Kennzahlen */
.kpi{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px;margin-bottom:16px;border-radius:16px;background:linear-gradient(135deg,#141416 0%,#232326 60%,#2a2a05 100%);border:1px solid var(--line)}
.kpi::before{content:"";position:absolute;right:-80px;top:-100px;width:280px;height:280px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,254,15,.28) 0%,rgba(255,254,15,.05) 45%,transparent 70%)}
.k{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:14px 16px}
button.k:hover{border-color:var(--y)}
.kv{font-family:var(--f-h);font-size:26px;color:var(--y-t);letter-spacing:.01em}.kv.neg{color:var(--bad)}.kl{font-size:12.5px;color:var(--ink2)}
.k.hi{background:var(--y);border-color:var(--y)}.k.hi .kv,.k.hi .kl{color:#1F1F21}
.k.alarm{border-color:rgba(240,80,90,.6)}.k.alarm .kv{color:var(--bad-t)}
.alerts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.alert{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-align:left}.alert:hover{border-color:var(--y)}.alert.bad{border-color:rgba(240,80,90,.55)}.alert.ai{border-color:rgba(255,254,15,.5)}
.kv2{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.kv2.tot{font-weight:700}
.hero-empty{background:var(--surface);border:1.5px dashed var(--y);border-radius:16px;padding:24px;margin-bottom:16px}.hero-empty h2{color:var(--y-t);margin-bottom:6px}
.dropzone{border:1.5px dashed rgba(255,254,15,.55);border-radius:14px;padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px;background:var(--y-soft);cursor:pointer}
.dropzone span{font-size:13px;color:var(--ink2)}

/* Diagramme */
.chart{width:100%;height:auto;display:block}.chart .gl{stroke:var(--line)}.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-b)}
.c1{fill:var(--y);background:var(--y)}.c2{fill:#8a8f99;background:#8a8f99}.c3{fill:var(--ok);background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:8px}.hb-r{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}.hb-b{background:var(--bg2);height:10px;border-radius:5px;overflow:hidden}.hb-b i{display:block;height:100%;background:var(--y);border-radius:5px}
.hb-v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.hb-v small{color:var(--muted);margin-left:6px}

/* Tabellen */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.card .tw{background:none}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg2);position:sticky;top:0}
.tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
/* Problemseite: aufklappbare Rubriken in voller Breite */
.abg-list{display:flex;flex-direction:column;gap:10px}
.abg{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px}
.abg.ton-bad{border-left-color:var(--bad)}.abg.ton-warn{border-left-color:var(--warn)}.abg.ton-ok{border-left-color:var(--ok)}.abg.ton-leer{opacity:.6}
.abg summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;user-select:none;flex-wrap:wrap}
.abg summary::-webkit-details-marker{display:none}
.abg summary:hover{background:var(--surface2);border-radius:12px}
.abg-t{font-family:var(--f-h);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.abg .cnt{font-size:13px;padding:3px 10px}.abg.ton-bad .cnt{background:var(--bad);color:#fff}.abg.ton-warn .cnt{background:rgba(245,165,36,.25);color:var(--warn)}
.abg-s{font-weight:700;font-variant-numeric:tabular-nums}.abg-z{color:var(--muted);font-size:13px}
.abg-c{transition:transform .2s;font-size:18px;color:var(--muted)}.abg[open] .abg-c{transform:rotate(180deg)}
.abg-b{padding:0 16px 16px}.abg-b>p{margin:0 0 10px}
.abg .tw.scroll{max-height:calc(100vh - 160px)}
.tb td.mono{white-space:nowrap}
/* ===== Tabellen im Excel-Look: weiß, feines Gitter, Kopfzeile und Hervorhebungen wie in der Excel-Mappe ===== */
:root{--xl-bg:#FFFFFF;--xl-ink:#1F1F1F;--xl-muted:#6B6B6B;--xl-grid:#D9D9D9;--xl-head:#FFFF00;--xl-head-ink:#000000;--xl-filter:#F2F2F2;--xl-hover:#E8F0FE;--xl-sel:#CCE0FF;
  --xl-ok:#C6EFCE;--xl-ok-ink:#006100;--xl-bad:#FFC7CE;--xl-bad-ink:#9C0006;--xl-warn:#FFEB9C;--xl-warn-ink:#9C5700;--xl-info:#DDEBF7;--xl-info-ink:#1F4E78}
.tw.scroll{background:var(--xl-bg);border-color:#BFBFBF;border-radius:4px}
.tw.scroll .tb{font-family:Aptos,Calibri,'Segoe UI',Arial,sans-serif;font-size:13.5px;color:var(--xl-ink);border-collapse:separate;border-spacing:0}
.tw.scroll .tb td{border-bottom:1px solid var(--xl-grid);border-right:1px solid var(--xl-grid);padding:5px 8px;background:var(--xl-bg);color:var(--xl-ink)}
.tw.scroll .tb th{border-bottom:1px solid #A6A6A6;border-right:1px solid #BFBFBF;padding:6px 8px;background:var(--xl-head);color:var(--xl-head-ink);font-weight:700;text-transform:none;letter-spacing:0;font-size:13px}
.tw.scroll .tb tr.frow th{background:var(--xl-filter);border-bottom:1px solid #A6A6A6}
.tw.scroll .tb .cf{background:#fff;color:var(--xl-ink);border-color:#C8C8C8;border-radius:2px}
.tw.scroll .tb .cf.on{background:#FFF2CC;border-color:#BF9000}
.tw.scroll .tb th .sa{opacity:.55}.tw.scroll .tb th.srt.on .sa{opacity:1;color:var(--xl-head-ink)}
.tw.scroll .tb.click tbody tr:hover td{background:var(--xl-hover)}
.tw.scroll .tb td.stick{background:var(--xl-bg);box-shadow:2px 0 0 #A6A6A6}.tw.scroll .tb.click tbody tr:hover td.stick{background:var(--xl-hover)}
.tw.scroll .tb thead th.stick{background:var(--xl-head)}.tw.scroll .tb tr.frow th.stick{background:var(--xl-filter)}
.tw.scroll .tb .muted,.tw.scroll .tb small{color:var(--xl-muted)}
.tw.scroll .tb .neg{color:#C00000}.tw.scroll .tb .pos{color:#00703C}
.tw.scroll .tb .zweck{color:#404040}
.tw.scroll .tb tr.unchecked td:first-child{box-shadow:inset 3px 0 0 #FFC000}
/* Status-Zellen in Excel-Farben (wie bedingte Formatierung) */
.tw.scroll .tb .badge,.tw.scroll .tb .st-sel{border-radius:3px}
.tw.scroll .tb .st-ok{background:var(--xl-ok);color:var(--xl-ok-ink)}.tw.scroll .tb .st-late{background:var(--xl-bad);color:var(--xl-bad-ink)}
.tw.scroll .tb .st-bad{background:#FF0000;color:#fff}.tw.scroll .tb .st-warn{background:var(--xl-warn);color:var(--xl-warn-ink)}
.tw.scroll .tb .st-info{background:var(--xl-info);color:var(--xl-info-ink)}.tw.scroll .tb .st-open{background:#F2F2F2;color:#404040}.tw.scroll .tb .st-ai{background:#FFF2CC;color:#7F6000}
.tw.scroll .tb .st-sel option{background:#fff;color:#1F1F1F}
.tw.scroll::-webkit-scrollbar-track{background:#F0F0F0}.tw.scroll::-webkit-scrollbar-thumb{border-color:#F0F0F0}
/* Spaltenbreite ziehen */
.col-gr{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:3;touch-action:none}
.col-gr::after{content:"";position:absolute;left:4px;top:25%;height:50%;width:1px;background:var(--line)}
.col-gr:hover::after,.tw.col-resize .col-gr::after{background:var(--y);width:3px;left:3px}
.tw.col-resize{cursor:col-resize;user-select:none}
.tb .fix-w{overflow:hidden;text-overflow:ellipsis}.tb th.fix-w{white-space:nowrap}
@media (max-width:860px){.col-gr{width:16px;right:-8px}}
/* Bezahlen */

/* Toast, Laden, Ziehen */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--y);color:#1F1F21;font-weight:700;padding:11px 18px;border-radius:10px;z-index:300;transition:transform .25s;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:250;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ink);text-align:center;padding:20px}
#busy.on{display:flex}.wheel{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--y);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dropveil{position:fixed;inset:0;z-index:90;background:rgba(31,31,33,.85);border:3px dashed var(--y);display:none;align-items:center;justify-content:center;pointer-events:none}
.dropveil.on{display:flex}.dropveil div{font-family:var(--f-h);font-size:32px;color:var(--y-t);text-align:center;display:flex;flex-direction:column}.dropveil small{font-family:var(--f-b);font-size:15px;color:var(--ink2)}

/* KI-Chat */
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--y);color:#1F1F21;font-size:24px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:80}
.aic{position:fixed;right:18px;bottom:18px;width:min(520px,calc(100vw - 32px));height:min(720px,calc(100vh - 100px));background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:95;display:flex;flex-direction:column}
.aic[hidden]{display:none}
.aic header{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--f-h);font-size:17px}

.m{padding:10px 13px;border-radius:12px;max-width:92%;overflow-wrap:anywhere}.m.u{align-self:flex-end;background:var(--y);color:#1F1F21;font-weight:500}.m.a{align-self:flex-start;background:var(--surface);width:92%}

@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}

.td-li:hover{border-color:var(--ink2)}.td-li.prio-dringend{border-left-color:var(--bad)}.td-li.prio-hoch{border-left-color:var(--warn)}

  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}

  .omni{flex-wrap:wrap}.omni input{flex:1 1 100%;order:-1}.hb-job3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}.form2{grid-template-columns:1fr}.det.with-doc{grid-template-columns:1fr}
  .filters .search{width:100%;flex:1 1 100%}.filters>select.inp{flex:1 1 auto}h1{font-size:22px}.kv{font-size:20px}
  .toolbar{gap:8px}.toolbar h1{flex:1 1 100%}.toolbar .sp{display:none}.toolbar .btn{flex:1 1 auto;justify-content:center}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}.chip{white-space:nowrap}
