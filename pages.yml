# Veröffentlicht die App automatisch auf GitHub Pages, sobald etwas auf "main" hochgeladen wird.
# Funktioniert mit beiden Ablagen: Ordner "web" ODER alle Dateien direkt im Hauptordner (Upload über die GitHub-Webseite).
# Stand wie im Repository, nur mit aktuellen Versionen der GitHub-Bausteine (Node 24).
name: Veroeffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Seite zusammenbauen
        run: |
          mkdir -p site/js
          if [ -d web ]; then cp -r web/. site/; fi
          [ -f index.html ] && cp index.html site/
          [ -f config.js ] && cp config.js site/
          for f in *.js; do [ -f "$f" ] && [ "$f" != config.js ] && cp "$f" site/js/; done
          # Versionsnummer an jede Programmdatei hängen, damit Browser nach dem Hochladen sofort die neue Fassung laden
          sed -i -E "s#src=\"(js/[A-Za-z0-9_-]+\.js|config\.js)\"#src=\"\1?v=${GITHUB_SHA:0:8}\"#g" site/index.html
          grep -o 'src="[^"]*"' site/index.html
          ls -R site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub findet das Paket manchmal nicht sofort ("No artifacts named github-pages") – dann kurz warten und nochmal
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
